name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 수동 배포 버튼

# 배포가 겹쳐 실행되지 않도록 직렬화 (진행 중인 배포는 취소하지 않음)
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_PATH: /usr/local/project/dngg

jobs:
  # 어느 영역이 바뀌었는지 감지해 필요한 것만 빌드한다
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deploy-config: ${{ steps.filter.outputs.deploy-config }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            deploy-config:
              - 'docker-compose.yaml'
              - '.github/workflows/deploy.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 테스트 실패 시 배포 중단 (그룹 소유권 검증 테스트 포함)
      - name: Run tests
        run: pnpm test

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dngg-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/dngg-backend:sha-${{ github.sha }}

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # NEXT_PUBLIC_API_URL은 빌드 시점에 번들에 박히므로 build-arg로 주입
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://dngg.one/api' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dngg-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/dngg-frontend:sha-${{ github.sha }}

  deploy:
    needs: [changes, backend, frontend]
    # 빌드 잡이 스킵돼도(변경 없음) 실패만 없으면 배포 실행
    if: >-
      ${{ !cancelled() &&
          needs.backend.result != 'failure' &&
          needs.frontend.result != 'failure' &&
          (needs.changes.outputs.backend == 'true' ||
           needs.changes.outputs.frontend == 'true' ||
           needs.changes.outputs.deploy-config == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 서버의 compose 파일을 repo 버전과 동기화
      - name: Sync docker-compose.yaml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yaml
          target: ${{ env.DEPLOY_PATH }}

      - name: Pull images and restart services
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}
            docker compose pull frontend backend
            docker compose up -d
            docker compose ps
            docker image prune -f

      - name: Health check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            sleep 10
            curl -sf http://127.0.0.1:3010/group/all > /dev/null && echo "backend OK"
            curl -sfI http://127.0.0.1:3000 > /dev/null && echo "frontend OK"
