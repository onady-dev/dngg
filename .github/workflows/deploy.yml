name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 수동 배포 버튼

# 배포가 겹쳐 실행되지 않도록 직렬화 (진행 중인 배포는 취소하지 않음)
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_PATH: /usr/local/project/dngg

jobs:
  # 어느 영역이 바뀌었는지 감지해 필요한 것만 빌드한다
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deploy-config: ${{ steps.filter.outputs.deploy-config }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            deploy-config:
              - 'docker-compose.yaml'
              - '.github/workflows/deploy.yml'

  backend:
    needs: changes
    # 수동 배포(workflow_dispatch)는 경로 필터와 무관하게 전체를 빌드한다
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # 로컬 개발 pnpm 버전과 정확히 일치시킨다 — pnpm 9는 packages 없는
      # pnpm-workspace.yaml(allowBuilds 전용)을 파싱하지 못해 install이 실패한다
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      # pnpm 11.x는 node:sqlite를 사용해 Node 22.13+ 필수 — CI 테스트는 22로 실행.
      # 운영 컨테이너(Dockerfile)는 아직 node:20이므로 마이너 스큐 존재, 정렬 예정
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 테스트 실패 시 배포 중단 (그룹 소유권 검증 테스트 포함)
      - name: Run tests
        run: pnpm test

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dngg-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/dngg-backend:sha-${{ github.sha }}

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # NEXT_PUBLIC_API_URL은 빌드 시점에 번들에 박히므로 build-arg로 주입
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://dngg.one/api' }}
            NEXT_PUBLIC_TOSS_CLIENT_KEY=${{ vars.NEXT_PUBLIC_TOSS_CLIENT_KEY }}
            NEXT_PUBLIC_GA_ID=${{ vars.NEXT_PUBLIC_GA_ID }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dngg-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/dngg-frontend:sha-${{ github.sha }}

  deploy:
    needs: [changes, backend, frontend]
    # 빌드 잡이 스킵돼도(변경 없음) 실패만 없으면 배포 실행
    if: >-
      ${{ !cancelled() &&
          needs.backend.result != 'failure' &&
          needs.frontend.result != 'failure' &&
          (github.event_name == 'workflow_dispatch' ||
           needs.changes.outputs.backend == 'true' ||
           needs.changes.outputs.frontend == 'true' ||
           needs.changes.outputs.deploy-config == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ⚠️ 아래 네 단계는 모두 서버에 SSH로 접속한다. GitHub Actions 러너의 공인 IP는
      # 매번 달라지므로 **보안 그룹의 22번 포트가 0.0.0.0/0에 열려 있어야 한다.**
      # 2026-08-10에 22번을 작업 PC IP로 좁혔다가 이 단계에서 배포가 통째로 막혔다.
      # (이미지는 빌드·푸시되지만 서버에 반영되지 않아 조용히 구버전이 계속 돈다.)
      # 22번을 닫으려면 SSM 전환이나 러너 IP 자동 등록 같은 대안이 먼저 필요하다 —
      # docs/runbooks/scaling.md 참고. SSH는 키 전용 인증이라 공개해도 비밀번호
      # 브루트포스는 통하지 않는다.

      # 서버의 compose 파일을 repo 버전과 동기화
      - name: Sync docker-compose.yaml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yaml
          target: ${{ env.DEPLOY_PATH }}

      # 이번 런에서 빌드 성공한 서비스만 커밋 sha 태그로 핀 고정한다.
      # :latest 드리프트로 인한 신구 버전 혼합 배포(2026-07-18 장애)를 방지 —
      # 빌드가 스킵된 서비스는 .env의 직전 배포 sha를 그대로 유지한다.
      - name: Pin built services to this commit's image tag
        if: needs.backend.result == 'success' || needs.frontend.result == 'success'
        uses: appleboy/ssh-action@v1.2.0
        env:
          BACKEND_BUILT: ${{ needs.backend.result == 'success' }}
          FRONTEND_BUILT: ${{ needs.frontend.result == 'success' }}
          SHA_TAG: sha-${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: BACKEND_BUILT,FRONTEND_BUILT,SHA_TAG
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}
            pin() {
              if sudo grep -q "^$1=" .env; then
                sudo sed -i "s|^$1=.*|$1=$2|" .env
              else
                echo "$1=$2" | sudo tee -a .env > /dev/null
              fi
              echo "pinned $1=$2"
            }
            if [ "$BACKEND_BUILT" = "true" ]; then pin BACKEND_VERSION "$SHA_TAG"; fi
            if [ "$FRONTEND_BUILT" = "true" ]; then pin FRONTEND_VERSION "$SHA_TAG"; fi

      - name: Pull images and restart services
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}
            docker compose pull frontend backend
            docker compose up -d
            docker compose ps
            docker image prune -f

      - name: Health check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            sleep 10
            curl -sf http://127.0.0.1:3010/health/ready > /dev/null && echo "backend OK"
            curl -sfI http://127.0.0.1:3000 > /dev/null && echo "frontend OK"
