# 배포 절차 (루트 package.json 스크립트 사용):
#   로컬:  .env의 FRONTEND_VERSION/BACKEND_VERSION 갱신 후
#          npm run deploy          # 이미지 빌드 + push
#   서버:  .env 버전 동기화 후
#          npm run deploy:update   # 이미지 pull + up -d

services:
  db:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_DB=${DB_DATABASE}
      - TZ=Asia/Seoul
    container_name: postgres
    volumes:
      - ./postgresql.conf:/etc/postgresql.conf
      - ./pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: onady/dngg-frontend:${FRONTEND_VERSION:-latest}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}

    depends_on:
      - backend
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: onady/dngg-backend:${BACKEND_VERSION:-latest}
    ports:
      - "3010:3010"
    # 시크릿은 이미지에 넣지 않고 서버의 .env에서 컨테이너 환경변수로 주입한다.
    environment:
      - NODE_ENV=prod
      - TZ=Asia/Seoul
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - PORT=${PORT:-3010}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - db
    restart: always

