# 배포는 CI/CD 자동화됨 — main 푸시 시 .github/workflows/deploy.yml이 빌드·푸시·배포한다.
# 수동 빌드/푸시 금지 (CLAUDE.md의 "배포 — CI/CD" 섹션 참고).
# 아래 npm 스크립트(deploy:*)는 CI 장애 시 비상용 레거시:
#   로컬:  npm run deploy          # 이미지 빌드 + push (반드시 linux/amd64로)
#   서버:  npm run deploy:update   # 이미지 pull + up -d

services:
  db:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_DB=${DB_DATABASE}
      - TZ=Asia/Seoul
    container_name: postgres
    volumes:
      - ./postgresql.conf:/etc/postgresql.conf
      - ./pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: onady/dngg-frontend:${FRONTEND_VERSION:-latest}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}

    depends_on:
      - backend
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: onady/dngg-backend:${BACKEND_VERSION:-latest}
    ports:
      - "3010:3010"
    # 시크릿은 이미지에 넣지 않고 서버의 .env에서 컨테이너 환경변수로 주입한다.
    environment:
      - NODE_ENV=prod
      - TZ=Asia/Seoul
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - PORT=${PORT:-3010}
      - JWT_SECRET=${JWT_SECRET}
      - MAIL_FROM=${MAIL_FROM}
      - AWS_REGION=${AWS_REGION:-ap-northeast-2}
      # 구독 결제(토스) — 서버 .env에서 주입. TOSS_SECRET_KEY 미설정 시 결제가
      # 조용히 401 실패하고 가격은 기본값으로 폴백돼 오탐하기 쉽다.
      - TOSS_SECRET_KEY=${TOSS_SECRET_KEY}
      - SUBSCRIPTION_PRICE_MONTHLY=${SUBSCRIPTION_PRICE_MONTHLY:-9900}
      - SUBSCRIPTION_PRICE_YEARLY=${SUBSCRIPTION_PRICE_YEARLY:-99000}
      - FREE_GAME_LIMIT=${FREE_GAME_LIMIT:-10}
      - TOSS_WEBHOOK_SECRET=${TOSS_WEBHOOK_SECRET}
    depends_on:
      - db
    restart: always

