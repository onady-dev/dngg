# 배포는 CI/CD 자동화됨 — main 푸시 시 .github/workflows/deploy.yml이 빌드·푸시·배포한다.
# 수동 빌드/푸시 금지 (CLAUDE.md의 "배포 — CI/CD" 섹션 참고).
# 아래 npm 스크립트(deploy:*)는 CI 장애 시 비상용 레거시:
#   로컬:  npm run deploy          # 이미지 빌드 + push (반드시 linux/amd64로)
#   서버:  npm run deploy:update   # 이미지 pull + up -d

services:
  db:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_DB=${DB_DATABASE}
      - TZ=Asia/Seoul
    container_name: postgres
    volumes:
      - ./pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: onady/dngg-frontend:${FRONTEND_VERSION:-latest}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}

    depends_on:
      - backend
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: onady/dngg-backend:${BACKEND_VERSION:-latest}
    ports:
      - "3010:3010"
    # 시크릿은 이미지에 넣지 않고 서버의 .env에서 컨테이너 환경변수로 주입한다.
    environment:
      - NODE_ENV=prod
      - TZ=Asia/Seoul
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - PORT=${PORT:-3010}
      - JWT_SECRET=${JWT_SECRET}
      - MAIL_FROM=${MAIL_FROM}
      # 발신 주소(no-reply@)는 수신함이 없다 — 사용자의 답장이 도착할 주소.
      # 비어 있으면 Reply-To 헤더를 넣지 않는다(답장은 사라진다).
      - MAIL_REPLY_TO=${MAIL_REPLY_TO}
      - AWS_REGION=${AWS_REGION:-ap-northeast-2}
      # 구독 결제(토스) — 서버 .env에서 주입. TOSS_SECRET_KEY 미설정 시 결제가
      # 조용히 401 실패하고 가격은 기본값으로 폴백돼 오탐하기 쉽다.
      - TOSS_SECRET_KEY=${TOSS_SECRET_KEY}
      - SUBSCRIPTION_PRICE_MONTHLY=${SUBSCRIPTION_PRICE_MONTHLY:-9900}
      - SUBSCRIPTION_PRICE_YEARLY=${SUBSCRIPTION_PRICE_YEARLY:-99000}
      - FREE_GAME_LIMIT=${FREE_GAME_LIMIT:-10}
      - TOSS_WEBHOOK_SECRET=${TOSS_WEBHOOK_SECRET}
      # L1 확장(t3.small) 시 20으로 올린다 — docs/runbooks/scaling.md 참고
      # 기본값 10은 부하 테스트에서 실제 병목으로 확인됐다 — 동시 25명부터 p95가
      # 1초를 넘고, 40으로 올리자 동시 50명에서 p95가 3.1초 → 37ms로 떨어졌다.
      # 상한은 Postgres max_connections(100) — 앱을 다중화하면 인스턴스 수를 곱해 넘지 말 것.
      # 자세한 실측은 docs/runbooks/scaling.md 참고.
      - DB_POOL_MAX=${DB_POOL_MAX:-40}
      # 전역 로그인 한도(5분 창). 전역 단일 버킷이라 스파이크 때 정상 사용자를
      # 429로 잠글 수 있다 — 그때 서버 .env에서 올리고 컨테이너만 재시작한다.
      - SITEWIDE_LOGIN_THROTTLE_LIMIT=${SITEWIDE_LOGIN_THROTTLE_LIMIT:-300}
    depends_on:
      - db
    restart: always

