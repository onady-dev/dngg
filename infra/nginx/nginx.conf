    server {
    if ($host = www.dngg.one) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = dngg.one) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


        listen       80;
        listen       [::]:80;
        server_name  dngg.one www.dngg.one;
    return 404; # managed by Certbot




}}
