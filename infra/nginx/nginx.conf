# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # ── 확장 대비 추가 (2026-08-10) ───────────────────────────────────
    # 요청 처리 시간을 남긴다. scripts/monitor-resources.sh가 rt= 값으로 p95를 계산하므로
    # 이 필드를 지우면 모니터링의 응답시간 경보가 조용히 죽는다.
    log_format  timed '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                      'rt=$request_time urt=$upstream_response_time';

    # rate limit 예외 IP. 여기 있는 주소는 빈 키를 받아 제한에서 제외된다
    # (nginx는 limit_req 키가 비면 제한을 적용하지 않는다).
    # 관리자 접속과 부하 테스트가 스스로 429에 걸리는 것을 막는다.
    geo $rate_limited {
        default              1;
        211.201.47.116/32    0;  # 작업 PC
        175.197.23.126/32    0;
        119.196.110.67/32    0;
        119.196.110.160/32   0;
        220.76.219.142/32    0;
    }
    map $rate_limited $rate_limit_key {
        0  "";
        1  $binary_remote_addr;
    }

    # 값을 넉넉하게 잡은 이유: 국내 이동통신사 CGNAT로 정상 사용자 여럿이 한 공인 IP를
    # 공유한다. 빡빡하게 잡으면 마케팅 스파이크 때 진짜 사용자를 막아 이 작업의 목적이
    # 무너진다. 여기서 막으려는 건 정상 트래픽이 아니라 단일 출처의 폭주다.
    limit_req_zone $rate_limit_key zone=api:10m rate=50r/s;
    limit_req_zone $rate_limit_key zone=web:10m rate=100r/s;
    limit_req_status 429;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript application/x-javascript
               text/css text/plain text/xml application/xml image/svg+xml;
    # ──────────────────────────────────────────────────────────────────

    access_log  /var/log/nginx/access.log  timed;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    # See http://nginx.org/en/docs/ngx_core_module.html#include
    # for more information.
    include /etc/nginx/conf.d/*.conf;

    server {
    listen 80;
    listen [::]:80;
    server_name dngg.one www.dngg.one;

    location / {
        limit_req zone=web burst=200 nodelay;
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
            limit_req zone=api burst=100 nodelay;
            proxy_pass         http://localhost:3010/;
            proxy_redirect     off;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 100M;
    }
#    location /exchange/ {
#            proxy_pass         http://localhost:4000/;
#            proxy_redirect     off;
#            proxy_set_header   Host $host;
#            proxy_set_header   X-Real-IP $remote_addr;
#            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
#            client_max_body_size 100M;
#    }

    include /etc/nginx/default.d/*.conf;

    error_page 404 /404.html;
    location = /404.html {
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dngg.one/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dngg.one/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    }

